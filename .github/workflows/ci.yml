name: Cross-Platform Mobile CI

on:
  # Automatically run on pushes and pull requests to the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allow manual runs from the Actions tab in GitHub
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Platform to run tests against'
        required: true
        default: 'QA-Android'
        type: choice
        options:
          - QA-Android
          - Production-Android
          - QA-iOS
          - Production-iOS
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all

jobs:
  test-android:
    if: contains(github.event.inputs.target_platform, 'Android')
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push report to gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Enable KVM
        run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules && sudo udevadm control --reload-rules && sudo udevadm trigger
      - name: Install Android Tools
        run: npm install -g appium && npm install -g allure-commandline && appium driver install uiautomator2
      - name: Run Android Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          target: google_apis
          arch: x86_64
          api-level: 34
          script: |
            if [ "${{ github.event.inputs.test_suite }}" = "all" ]; then
              pytest android/tests/ -o env=${{ lower(github.event.inputs.target_platform) }}
            else
              pytest android/tests/ -m "${{ github.event.inputs.test_suite }}" -o env=${{ lower(github.event.inputs.target_platform) }}
            fi
      # ... (report steps would be here)

  test-ios:
    if: contains(github.event.inputs.target_platform, 'iOS')
    runs-on: macos-latest
    permissions:
      contents: write # To push report to gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install iOS Tools
        run: npm install -g appium && npm install -g allure-commandline && appium driver install xcuitest
      - name: Run iOS Tests
        uses: futureware-tech/simulator-action@v3
        with:
          model: 'iPhone 15'
          os: '17.0'
          shutdown_after: true
          run: |
            if [ "${{ github.event.inputs.test_suite }}" = "all" ]; then
              pytest ios/tests/ -o env=${{ lower(github.event.inputs.target_platform) }}
            else
              pytest ios/tests/ -m "${{ github.event.inputs.test_suite }}" -o env=${{ lower(github.event.inputs.target_platform) }}
            fi
      # ... (report steps would be here)