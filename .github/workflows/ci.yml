name: Android CI

on:
  # Automatically run on pushes and pull requests to the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allow manual runs from the Actions tab in GitHub
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to run tests against'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - Production
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all

jobs:
  test-qa:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'QA'
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push report to gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger

      - name: Install Tools
        run: |
          npm install -g appium
          npm install -g allure-commandline
          appium driver install uiautomator2

      - name: Run QA Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          target: google_apis
          arch: x86_64
          api-level: 34
          script: if [ "${{ github.event.inputs.test_suite }}" = "all" ]; then pytest -o env=qa_android; else pytest -m "${{ github.event.inputs.test_suite }}" -o env=qa_android; fi

      - name: Generate Allure Report
        if: always()
        run: allure generate resources/allure-results --clean -o allure-report

      - name: Deploy Allure Report to GH Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          destination_dir: ${{ github.run_id }}

      - name: Output Report URL
        if: always()
        run: echo "### Allure Report URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

  test-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'Production'
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push report to gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger

      - name: Install Tools
        run: |
          npm install -g appium
          npm install -g allure-commandline
          appium driver install uiautomator2

      - name: Run Production Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          target: google_apis
          arch: x86_64
          api-level: 34
          script: if [ "${{ github.event.inputs.test_suite }}" = "all" ]; then pytest -o env=production_android; else pytest -m "${{ github.event.inputs.test_suite }}" -o env=production_android; fi

      - name: Generate Allure Report
        if: always()
        run: allure generate resources/allure-results --clean -o allure-report

      - name: Deploy Allure Report to GH Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          destination_dir: ${{ github.run_id }}

      - name: Output Report URL
        if: always()
        run: echo "### Allure Report URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
